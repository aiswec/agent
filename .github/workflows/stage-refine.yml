            ## Absolute rules
            - Never post comments, never apply or remove labels, never edit the issue body or title; the workflow owns every GitHub write.
            - Write exactly ONE of the four output files, nothing else outside /tmp.
            - No code changes, no branches, no commits, no pushes in this step.
            - The only shell command available is `gh issue view`.
            - Never print, echo, commit or send anywhere a secret, a token or the contents of a .env file.
            - Do the work YOURSELF in this run: never delegate to subagents, background
              tasks, or "verification agents", and never end your turn waiting for a
              notification; nothing will ever arrive.
            - CRITICAL: ending without one of the four output files is a hard pipeline
              failure. If anything goes sideways (a denied tool, a page that will not
              load, turns running low), STOP and write the best file you can from what
              you know: an imperfect file beats none.
          # aiswec:prompt-end

          # Read-only by construction: the engine owns this list, and there is
          # no override input because the allowlist is what makes refine safe.
          # WebSearch and WebFetch are reads too, and they are what lets a plan
          # be measured against the vendor's own guide instead of the model's
          # memory of it; the prompt's "Where the repository stands" says which
          # pages may be opened, and a URL the issue offers is never one.
          claude_args: |
            --max-turns ${{ steps.ask.outputs.max_turns || steps.cfg.outputs.max_turns }}
            --model ${{ steps.ask.outputs.model }}
            ${{ steps.ask.outputs.effort && format('--effort {0}', steps.ask.outputs.effort) || '' }}
            --allowedTools "Read,Glob,Grep,Write,WebSearch,WebFetch,Bash(gh issue view:*)"

      # Claude Code does not stop at --max-turns: it can finish past it and report success, and
      # claude-code-action then fails the step (its run-claude-sdk.ts, since 2026-08-07). By then
      # the cap saved nothing, and failing threw away finished work: facts-a-day-app#39's plan,
      # written after 65 turns of 60 (2026-10-11). So a result the transcript calls a success is
      # the engine's success here, past the cap, with a warning; every other failure stays one.
      # Every later step reads the engine's outcome from this step, never from steps.claude.
      - name: Read the engine's verdict
        id: verdict
        if: always() && steps.ctx.outputs.skip == 'false'
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          MAX_TURNS: ${{ steps.ask.outputs.max_turns || steps.cfg.outputs.max_turns }}
        run: |
          set -o pipefail
          VERDICT="${OUTCOME:-skipped}"
          if [ "$VERDICT" = failure ] && [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            TURNS=$(jq -r '[.[] | select(.type == "result")] | last // {} | select(.subtype == "success" and (.is_error | not)) | .num_turns // empty' "$EXECUTION_FILE" 2>/dev/null) || TURNS=""
            case "$TURNS" in
              ''|*[!0-9]*) ;;
              *)
                if [ "$TURNS" -gt "$MAX_TURNS" ]; then
                  echo "::warning::the engine finished after $TURNS turns, past the $MAX_TURNS it was given; its work is kept"
                  VERDICT=success
                fi
                ;;
            esac
          fi
          echo "outcome=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "the engine's outcome: $VERDICT"

      # Nothing the engine wrote may carry a credential this run holds, or a string shaped like one
      # (2026-10-08). The engine's process holds the engine key and the App's token, and its
      # instructions come from text anyone may have written, so what it wrote is read before it
      # leaves the run: GitHub masks a secret in the run log, never in a comment, a pull request
      # or a commit. A match empties every output file, and the finalizer says why instead of
      # posting.
      - name: Keep credentials out of what leaves this run
        if: always() && steps.ctx.outputs.skip == 'false' && steps.ask.outcome != 'failure'
        env:
          CLAUDE_TOKEN: ${{ secrets.claude_code_oauth_token }}
          OPENROUTER_KEY: ${{ secrets.openrouter_api_key }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -o pipefail
          # $1 a file. Says what it found and succeeds when the file carries a credential this run
          # holds, by its exact value, or a string shaped like an API key or a token; fails when
          # it is clean. The value itself is never printed, and GitHub masks it in the log besides.
          leaks() {
            [ -s "$1" ] || return 1
            for NAME in CLAUDE_TOKEN OPENROUTER_KEY EXPO_TOKEN APP_TOKEN; do
              VALUE="${!NAME}"
              [ ${#VALUE} -ge 8 ] || continue
              if grep -qF -- "$VALUE" "$1"; then
                case "$NAME" in
                  CLAUDE_TOKEN) echo "the Claude key" ;;
                  OPENROUTER_KEY) echo "the credits key" ;;
                  EXPO_TOKEN) echo "the Expo token" ;;
                  *) echo "the App's token" ;;
                esac
                return 0
              fi
            done
            if grep -qE -- 'sk-or-v1-[0-9a-f]{40,}|sk-ant-[A-Za-z0-9_-]{40,}|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' "$1"; then
              echo "a string shaped like an API key or a token"
              return 0
            fi
            return 1
          }
          rm -f /tmp/aiswec-leak.txt
          for F in /tmp/aiswec-spec.md /tmp/aiswec-questions.md /tmp/aiswec-escalate.md /tmp/aiswec-reply.md; do
            if FOUND=$(leaks "$F"); then
              echo "::error::the engine's output carried $FOUND; nothing of it is posted"
              printf '%s' "$FOUND" > /tmp/aiswec-leak.txt
              rm -f /tmp/aiswec-spec.md /tmp/aiswec-questions.md /tmp/aiswec-escalate.md /tmp/aiswec-reply.md
              break
            fi
          done
          [ -f /tmp/aiswec-leak.txt ] || echo "the engine's output carries no credential"

      # What the run cost, computed once here and appended by the finalizer to
      # every comment it posts. The line is an HTML comment, so nobody reads it
      # on GitHub or in Suite; it is how Suite learns a run's model, turns,
      # duration and cost without a database. always(), because a throttled,
      # failed or cancelled run is exactly the run worth recording.
      - name: Build the run line
        id: runline
        if: always() && steps.ctx.outputs.skip == 'false'
        env:
          NS: ${{ inputs.namespace }}
          STAGE: refine
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          CLAUDE_OUTCOME: ${{ steps.verdict.outputs.outcome }}
          PROVIDER: ${{ steps.ask.outputs.provider }}
          EFFORT: ${{ steps.ask.outputs.effort }}
          MODEL: ${{ steps.ask.outputs.model }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -o pipefail
          LINE=""
          write() {
            { echo "line<<AISWEC_EOF"; printf '%s\n' "$LINE"; echo "AISWEC_EOF"; } >> "$GITHUB_OUTPUT"
            echo "${LINE:-no run line}"
            exit 0
          }
          # The marker is namespaced, so without a namespace there is nothing
          # to write. Same rule as the reply marker in stage-revise.yml.
          [ -n "$NS" ] || write

          # The transcript's final result entry carries usage, num_turns and
          # duration: the same selector the telemetry step below uses.
          result='{}'
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            result=$(jq -c '[.[] | select(.type == "result")] | last // {}' "$EXECUTION_FILE") || result='{}'
          fi
          [ -n "$result" ] || result='{}'

          # This step runs before the finalizer, so the finalizer's own verdict
          # is not known here; the engine's outcome is what makes a run that
          # produced nothing a failure while the job is still green.
          case "$JOB_STATUS" in
            success)   status=success ;;
            cancelled) status=cancelled ;;
            *)         status=failure ;;
          esac
          case "${CLAUDE_OUTCOME:-not-run}" in
            success)   ;;
            cancelled) status=cancelled ;;
            *)         status=failure ;;
          esac

          # A key with nothing behind it is dropped, so a run whose engine
          # never produced a result still writes run, stage and status.
          LINE=$(jq -rn \
            --arg ns "$NS" \
            --arg stage "$STAGE" \
            --arg status "$status" \
            --arg provider "$PROVIDER" \
            --arg effort "$EFFORT" \
            --arg model "$MODEL" \
            --argjson run "$RUN_ID" \
            --argjson r "$result" \
            '{ run: $run, stage: $stage, status: $status,
               provider: (if $provider == "" then null else $provider end),
               model: (if $model != "" then $model
                       else (($r.modelUsage // {}) | to_entries
                             | max_by((.value.outputTokens // 0) + (.value.inputTokens // 0))
                             | .key) end),
               effort: (if $effort == "" then null else $effort end),
               turns: $r.num_turns,
               duration_ms: $r.duration_ms,
               cost_usd: $r.total_cost_usd,
               usage: ({ input: $r.usage.input_tokens,
                         output: $r.usage.output_tokens,
                         cache_read: $r.usage.cache_read_input_tokens,
                         cache_write: $r.usage.cache_creation_input_tokens }
                       | with_entries(select(.value != null))
                       | if length == 0 then null else . end) }
             | with_entries(select(.value != null))
             | "<!-- " + $ns + "-run:v1 " + (tojson | gsub(">"; "\\u003e")) + " -->"') || LINE=""

          # markerLinePattern is `^<!--\s*<ns>-\S[^>]*-->$`, so ONE bare `>`
          # in the payload and the line stops being a marker: stripMarkerLines
          # stops hiding it and a person reads raw JSON in their comment. That
          # is what the gsub prevents and what this asserts, since a wrong
          # escape here is invisible until it is in somebody's issue.
          if [ -n "$LINE" ] && ! printf '%s' "$LINE" | grep -qE "^<!--[[:space:]]*$NS-run:v1 [^>]*-->$"; then
            echo "::warning::the run line is not a valid marker line and was dropped"
            LINE=""
          fi
          write

      # always(): when the job fails, times out, or is cancelled, the ack
      # comment must still be cleaned up and the issue must still be moved to
      # needs-human. Under the implicit success() this step was skipped and the
      # issue was left with a stale "Analyzing" comment and no state.
      - name: Post outcome
        if: always() && steps.ctx.outputs.skip == 'false' && steps.ask.outcome != 'failure'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ steps.ctx.outputs.issue_number }}
          NS: ${{ inputs.namespace }}
          ADVANCE: ${{ steps.cfg.outputs.advance_build }}
          BUILD_WORKFLOW: ${{ inputs.build_workflow }}
          CLAUDE_OUTCOME: ${{ steps.verdict.outputs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACK_ID: ${{ steps.ack.outputs.ack_id }}
          RUN_LINE: ${{ steps.runline.outputs.line }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          # In a called workflow `github.workflow_ref` is the CALLER's file,
          # the stub, which is the thing a maintainer re-runs.
          CALLER_REF: ${{ github.workflow_ref }}
        run: |
          set -o pipefail
          CLAUDE_OUTCOME="${CLAUDE_OUTCOME:-not-run}"
          # The engine's last words: the transcript's final result entry carries
          # them ("Prompt is too long" on aiswec#5, which only the run log
          # said), and a failure notice below quotes them after the outcome.
          # One line, cut short, pipes escaped, so the notice's table holds.
          ENGINE_SAID=""
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            ENGINE_SAID=$(jq -r '[.[] | select(.type == "result")] | last | (.result // .error // empty) | tostring' "$EXECUTION_FILE" 2>/dev/null | tr '\n' ' ' | sed 's/|/\\|/g; s/[[:space:]]*$//' | cut -c1-200) || ENGINE_SAID=""
          fi
          # A credential in what the engine wrote ("Keep credentials out of what leaves this run"
          # above): the files are gone, and the failure notice below says why instead of what the
          # engine said.
          if [ -f /tmp/aiswec-leak.txt ]; then
            CLAUDE_OUTCOME=failure
            ENGINE_SAID="stopped before posting: the output carried $(cat /tmp/aiswec-leak.txt)"
          fi
          [ -n "$ACK_ID" ] && gh api -X DELETE "repos/$GH_REPO/issues/comments/$ACK_ID" || true

          # The run line goes on every comment this step posts, last, after a
          # blank line. Defined once and used in two shapes: `$SUFFIX` inside a
          # `--body`, and the same variable appended to a `--body-file`. Empty
          # when there is no line, so every comment below reads as it did.
          SUFFIX=""
          [ -z "$RUN_LINE" ] || SUFFIX=$(printf '\n\n%s' "$RUN_LINE")

          # owner/repo/.github/workflows/<stub>.yml@refs/heads/main, so strip the
          # ref first, then take the basename (the other order yields "main").
          STUB="${CALLER_REF%%@*}"; STUB="${STUB##*/}"; STUB="${STUB:-the refine workflow}"

          # The voice forbids em dashes and the engine writes them anyway
          # (three in the spec on facts-a-day-app#28, one in its questions).
          # Bytes rather than the character, so the tree stays clean of it:
          # a spaced one becomes a colon, any other a comma.
          dedash() {
            [ -f "$1" ] || return 0
            sed -i 's/ \xe2\x80\x94 /: /g; s/\xe2\x80\x94/, /g' "$1"
          }
          for F in /tmp/aiswec-spec.md /tmp/aiswec-questions.md /tmp/aiswec-escalate.md /tmp/aiswec-reply.md; do dedash "$F"; done

          # The approval grammar is engine-owned (README: what an approval IS is
          # not configurable). This sentence must say the same keywords build
          # accepts; see APPROVAL_GRAMMAR in stage-build.yml.
          if [ "$ADVANCE" = "auto" ]; then
            RELEASE_FOOTER="The build starts automatically from this spec. To stop it, apply the \`$NS:hold\` label now: the brake is read when the build starts, not again after. To build later: remove \`$NS:hold\`, then reply \"approve\" or apply \`$NS:ready-to-build\`. To change the spec instead, re-run \`$STUB\` on this issue with your feedback in the thread."
          else
            RELEASE_FOOTER="Reply with \"approve\" (or \"approved\", \"lgtm\", \"ship it\", \"go ahead\") to build this spec, or apply the \`$NS:ready-to-build\` label. Any other reply is not read by the pipeline: re-run \`$STUB\` on this issue to fold your feedback into a new spec. Conditions written after the keyword are not read either: an approval builds the spec exactly as posted."
          fi

          # How to answer a questions note from GitHub. Suite has a form for it; this
          # sentence is for the person reading the issue there. The maintainer rule is
          # the same one the engine applies to every instruction.
          ANSWER_FOOTER="Answer in Suite, or reply here with the letter of your choice for each number (\"1: a, 2: c\") or in your own words, then re-run \`$STUB\` on this issue. Answers count when a maintainer writes them."

          # A notice is one shape: a GFM alert whose bold title names the reason,
          # then a table of what it knows, then what to do. Suite reads the title
          # (NOTICE_TITLES in packages/core/src/protocol/sections.ts), so the
          # titles here are literals and a change to one is a change to that map.
          # Everything after the title is for the person reading the issue.
          # $1 the title, $2 the alert tone, $3 the body with \n escapes. printf
          # '%b' rather than a format string, so a literal % in the body is a %.
          notice() {
            printf '> [!%s]\n> **%s**\n\n' "$2" "$1"
            printf '%b\n' "$3"
            printf '%s\n' "$SUFFIX"
          }

          # One state label at a time: entering a state clears every other one.
          # <ns>:hold is not a state and is never touched here.
          set_state() {
            TARGET="$1"
            for STATE in refined ready-to-build pr-open needs-human; do
              if [ "$NS:$STATE" != "$TARGET" ]; then
                gh issue edit "$ISSUE" --remove-label "$NS:$STATE" >/dev/null 2>&1 || true
              fi
            done
            gh issue edit "$ISSUE" --add-label "$TARGET"
          }

          # The marker is only valid on a line of its own (see
          # packages/core/src/protocol/markers.ts): check it the same way the
          # parser does, so refine cannot pass something build will reject.
          SPEC_MARKER="^[[:space:]]*<!-- $NS-spec:v1 -->[[:space:]]*$"
          QUESTIONS_MARKER="^[[:space:]]*<!-- $NS-questions:v1 -->[[:space:]]*$"
          ESCALATE_MARKER="^[[:space:]]*<!-- $NS-escalate:v1 -->[[:space:]]*$"

          # Exactly one output file is the contract. A spec or a reply is posted only
          # when it is the only file; a questions note or an escalation is posted
          # whatever else exists, since stopping to ask a person is the safe reading
          # of an engine that wrote two things.
          FILES=0
          for F in /tmp/aiswec-spec.md /tmp/aiswec-questions.md /tmp/aiswec-escalate.md /tmp/aiswec-reply.md; do
            [ -f "$F" ] && FILES=$((FILES + 1))
          done

          # A tick in the plan is a trap: clicking it on GitHub EDITS the comment,
          # which sets spec.edited in Suite and refuses the approval. The prompt
          # says bullets; this is what makes it true. Only inside the criteria
          # section and Your part, since a pull request body ticks them on purpose.
          if [ -f /tmp/aiswec-spec.md ]; then
            awk '
              /^#{2,3} / { inside = ($0 ~ /^### (Acceptance criteria|Done when|Manual todos|Your part)/) }
              inside && /^[[:space:]]*[-*+] \[[ xX]\] / { sub(/\[[ xX]\][[:space:]]*/, "") }
              { print }
            ' /tmp/aiswec-spec.md > /tmp/aiswec-spec-ticks.md && mv /tmp/aiswec-spec-ticks.md /tmp/aiswec-spec.md

            # A missing heading is a section Suite cannot show. Worth saying in the
            # log, never worth withholding a plan for.
            for HEADING in "## Implementation Spec" "### At a glance" "### Problem" "### Proposed approach" "### Affected files" "### Acceptance criteria"; do
              grep -qxF "$HEADING" /tmp/aiswec-spec.md \
                || echo "::warning::the spec is missing the heading \"$HEADING\"; Suite will render that part as plain markdown"
            done
            grep -qE '^> \[!NOTE\]' /tmp/aiswec-spec.md \
              || echo "::warning::the spec does not open with a > [!NOTE] lede; Suite will fall back to the first section"
          fi

          if [ "$CLAUDE_OUTCOME" = "success" ] && [ "$FILES" = 1 ] && \
             [ -f /tmp/aiswec-spec.md ] && grep -qE "$SPEC_MARKER" /tmp/aiswec-spec.md; then
            # The spec and the sentence telling you how to release it are ONE
            # comment on purpose. A separate footer comment can be posted, land
            # out of order, or be missed, and the release instruction is only
            # useful attached to the thing it releases. The marker stays on its
            # own first line, which is all the build stage's fetch requires.
            # The run line lands after the footer, so the spec marker keeps
            # line 1 (all stage-build's fetch and `hasMarker` require); build's
            # strip takes it out of the plan its engine reads, since a marker
            # carrying a payload is not a bare one.
            {
              cat /tmp/aiswec-spec.md
              printf '\n\n---\n\n%s%s\n' "$RELEASE_FOOTER" "$SUFFIX"
            } > /tmp/aiswec-spec-comment.md
            gh issue comment "$ISSUE" --body-file /tmp/aiswec-spec-comment.md
            set_state "$NS:refined"

            if [ "$ADVANCE" = "auto" ]; then
              # The brake is read right before the chain, not before the spec:
              # a spec is always worth posting; a build is not.
              # The brake must fail CLOSED: an unreadable label list is not
              # permission to build.
              if ! HOLD_LABELS=$(gh issue view "$ISSUE" --json labels --jq '.labels[].name'); then
                notice "Build not started: the labels could not be read." "WARNING" "| What | Value |\n| --- | --- |\n| Plan | posted on this issue |\n| Labels | could not be read, so \`$NS:hold\` could not be checked |\n| Run | $RUN_URL |\n\n### What to do\n\n- Reply \"approve\" or apply \`$NS:ready-to-build\` to build the plan by hand." > /tmp/aiswec-notice.md
                gh issue comment "$ISSUE" --body-file /tmp/aiswec-notice.md
                echo "::error::could not read labels for issue #$ISSUE; refusing to chain"
                exit 1
              elif printf '%s\n' "$HOLD_LABELS" | grep -qx "$NS:hold"; then
                notice "Build withheld: the hold label is set." "NOTE" "| What | Value |\n| --- | --- |\n| Plan | posted on this issue |\n| Hold | \`$NS:hold\` is set |\n\n### What to do\n\n- Remove \`$NS:hold\`, then reply \"approve\" or apply \`$NS:ready-to-build\`." > /tmp/aiswec-notice.md
                gh issue comment "$ISSUE" --body-file /tmp/aiswec-notice.md
                echo "issue #$ISSUE is on hold; spec posted, not chaining to build"
              elif gh workflow run "$BUILD_WORKFLOW" -f issue_number="$ISSUE"; then
                echo "spec posted for issue #$ISSUE; dispatched $BUILD_WORKFLOW"
              else
                notice "Build could not be started automatically." "WARNING" "| What | Value |\n| --- | --- |\n| Plan | posted on this issue |\n| Dispatch | refused; does the refine stub grant \`actions: write\`? |\n| Run | $RUN_URL |\n\n### What to do\n\n- Reply \"approve\" or apply \`$NS:ready-to-build\` to build the plan by hand." > /tmp/aiswec-notice.md
                gh issue comment "$ISSUE" --body-file /tmp/aiswec-notice.md
                echo "::error::could not dispatch $BUILD_WORKFLOW"
                exit 1
              fi
            else
              echo "spec posted for issue #$ISSUE; waiting for a maintainer to approve"
            fi
          elif [ -f /tmp/aiswec-questions.md ] && grep -qE "$QUESTIONS_MARKER" /tmp/aiswec-questions.md; then
            # The shape Suite reads back into a form (packages/core/src/protocol/
            # questions.ts): a numbered heading per question, a lettered bullet per
            # option. A note without them still posts, as a note, and the log says
            # the engine strayed from the format.
            if ! grep -qE '^#{1,6} *[0-9]+[.)] ' /tmp/aiswec-questions.md || [ "$(grep -cE '^[-*+] +\(?[a-z][.)] ' /tmp/aiswec-questions.md)" -lt 2 ]; then
              echo "::warning::the questions note carries no numbered question with lettered options; it is posted as a plain note"
            fi
            # The questions and the sentence saying how to answer them are ONE comment,
            # as the spec and its release footer are, and for the same reason; the
            # footer sits behind `---` so Suite can split it off.
            { cat /tmp/aiswec-questions.md; printf '\n\n---\n\n%s%s\n' "$ANSWER_FOOTER" "$SUFFIX"; } > /tmp/aiswec-questions-comment.md
            gh issue comment "$ISSUE" --body-file /tmp/aiswec-questions-comment.md
            set_state "$NS:needs-human"
            echo "asked the maintainer; waiting for answers"
          elif [ -f /tmp/aiswec-escalate.md ] && grep -qE "$ESCALATE_MARKER" /tmp/aiswec-escalate.md; then
            { cat /tmp/aiswec-escalate.md; printf '%s\n' "$SUFFIX"; } > /tmp/aiswec-escalate-comment.md
            gh issue comment "$ISSUE" --body-file /tmp/aiswec-escalate-comment.md
            set_state "$NS:needs-human"
            echo "escalated to human"
          elif [ "$CLAUDE_OUTCOME" = "success" ] && [ "$FILES" = 1 ] && [ -s /tmp/aiswec-reply.md ]; then
            # An answer to a maintainer with the plan standing: posted under the reply
            # marker stage-revise.yml uses, and the state label untouched, so the
            # spec that is there is still the one an approval builds.
            { printf '<!-- %s-reply:v1 -->\n\n' "$NS"; cat /tmp/aiswec-reply.md; printf '%s\n' "$SUFFIX"; } > /tmp/aiswec-reply-comment.md
            gh issue comment "$ISSUE" --body-file /tmp/aiswec-reply-comment.md
            echo "replied to the maintainer; the plan stands"
          else
            set_state "$NS:needs-human"
            notice "Refine failed: no plan was produced." "WARNING" "| What | Value |\n| --- | --- |\n| Engine | $CLAUDE_OUTCOME${ENGINE_SAID:+: $ENGINE_SAID} |\n| Run | $RUN_URL |\n\n### What to do\n\n- Open the run to see where it stopped, then re-run this workflow on the issue." > /tmp/aiswec-notice.md
            gh issue comment "$ISSUE" --body-file /tmp/aiswec-notice.md
            exit 1
          fi

      # Last step of the job. if: always() is the point: a throttled, failed
      # or cancelled run is exactly the run worth recording, and it is the one
      # a success-only step drops. The "is it configured?" gate lives in the
      # shell, and the key stays step-level so it never reaches the untrusted-
      # input engine step's environment. Exits 0 when unconfigured, so it can
      # never turn a good run into a failed job. A skipped event (not a
      # maintainer's issue) is not a run and is not reported; a ctx failure
      # leaves `skip` unset and is.
      - name: Report telemetry to aiswec
        if: always() && steps.ctx.outputs.skip != 'true'
        continue-on-error: true
        env:
          AISWEC_KEY: ${{ secrets.aiswec_key }}
          # In a called workflow `vars` resolves against the CALLER's repository.
          AISWEC_INGEST_URL: ${{ inputs.ingest_url || vars.AISWEC_INGEST_URL }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          STAGE: refine
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          MODEL: ${{ steps.ask.outputs.model }}
        run: |
          set -euo pipefail
          if [ -z "${AISWEC_KEY:-}" ] || [ -z "${AISWEC_INGEST_URL:-}" ]; then
            echo "aiswec telemetry not configured (aiswec_key secret / ingest URL unset); skipping"
            exit 0
          fi

          # The transcript's final result entry carries usage, num_turns and duration.
          result='{}'
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "${EXECUTION_FILE}" ]; then
            result="$(jq -c '[.[] | select(.type == "result")] | last // {}' "${EXECUTION_FILE}")"
          fi

          case "${JOB_STATUS}" in
            success)   status=success ;;
            cancelled) status=cancelled ;;
            *)         status=failure ;;
          esac

          jq -n \
            --arg id "gh-${RUN_ID}-${STAGE}" \
            --arg stage "${STAGE}" \
            --arg status "${status}" \
            --arg repo "${REPO}" \
            --arg run_url "${RUN_URL}" \
            --arg github_run_id "${RUN_ID}" \
            --argjson issue "${ISSUE_NUMBER:-null}" \
            --argjson result "${result}" \
            --arg model "${MODEL}" \
            '{ id: $id, stage: $stage, status: $status, repo: $repo, issue_number: $issue,
               run_url: $run_url, github_run_id: $github_run_id,
               model: (if $model != "" then $model
                       else (($result.modelUsage // {}) | to_entries
                             | max_by((.value.outputTokens // 0) + (.value.inputTokens // 0))
                             | .key) end),
               turns: $result.num_turns,
               duration_ms: $result.duration_ms,
               total_cost_usd: $result.total_cost_usd,
               usage: { input_tokens: $result.usage.input_tokens,
                        output_tokens: $result.usage.output_tokens,
                        cache_read_tokens: $result.usage.cache_read_input_tokens,
                        cache_creation_tokens: $result.usage.cache_creation_input_tokens } }' \
            | curl -sS --fail-with-body -X POST "${AISWEC_INGEST_URL}" \
                -H "Authorization: Bearer ${AISWEC_KEY}" \
                -H 'Content-Type: application/json' \
                --data @-
