# AISWEC's revise stage: a maintainer reviews AISWEC's pull request, and a reply (and commits, when
# a change was asked for) comes back. Copy this file into your repository's .github/workflows/.
name: aiswec Revise

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request whose latest review to answer"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # only without an App of your own: the Claude GitHub App's token is fetched with it

concurrency:
  group: >-
    aiswec-revise-${{ github.event.issue.number
      || github.event.pull_request.number
      || github.event.inputs.pr_number }}${{ endsWith(github.actor, '[bot]') && '-bot' || '' }}
  cancel-in-progress: false

jobs:
  revise:
    if: github.event_name == 'workflow_dispatch' || !endsWith(github.actor, '[bot]')
    uses: aiswec/agent/.github/workflows/stage-revise.yml@v2
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      aiswec_app_id: ${{ secrets.AISWEC_APP_ID }}
      aiswec_app_private_key: ${{ secrets.AISWEC_APP_PRIVATE_KEY }}
      expo_token: ${{ secrets.EXPO_TOKEN }}
    with:
      namespace: aiswec
      branch_prefix: aiswec
