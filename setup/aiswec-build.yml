# AISWEC's build stage: a maintainer approves the plan, and a pull request comes back.
# Copy this file into your repository's .github/workflows/.
name: aiswec Build

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue whose approved plan to build"
        required: true
        type: string
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # only without an App of your own: the Claude GitHub App's token is fetched with it

concurrency:
  group: aiswec-build-${{ github.event.issue.number || inputs.issue_number }}${{ endsWith(github.actor, '[bot]') && '-bot' || '' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !endsWith(github.actor, '[bot]')
    uses: aiswec/agent/.github/workflows/stage-build.yml@v2
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      aiswec_app_id: ${{ secrets.AISWEC_APP_ID }}
      aiswec_app_private_key: ${{ secrets.AISWEC_APP_PRIVATE_KEY }}
      expo_token: ${{ secrets.EXPO_TOKEN }}
    with:
      namespace: aiswec
      branch_prefix: aiswec
      # base_branch: main # the branch pull requests are opened against, if yours is not main
